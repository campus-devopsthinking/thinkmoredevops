<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevOps Essentials for Beginners | Batch 1 – Starts Oct 1, 2026</title>
<meta name="description" content="35-day online DevOps course for engineering students and freshers. Linux, Git, Jenkins, Ansible, Apache, JBoss/WildFly, CI/CD. Learn by doing. Fee ₹2,000.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B1240; --muted:#5B5680; --paper:#FFF9F1; --card:#fff;
  --violet:#6C3CF0; --pink:#FF4F8B; --orange:#FF8A00; --yellow:#FFC93C;
  --teal:#00B8A9; --sky:#22A6F2; --green:#2FC46B; --red:#F0455A;
  --head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.6;font-size:17px}
a{color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
h1,h2,h3{font-family:var(--head);line-height:1.12;letter-spacing:-.015em}
h2{font-size:clamp(1.7rem,4vw,2.4rem);margin-bottom:12px}
.lead{color:var(--muted);max-width:56ch}
section{padding:72px 0}

.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:14px;font-weight:600;text-decoration:none;font-size:1rem;transition:transform .15s,box-shadow .15s}
.btn-main{background:linear-gradient(90deg,var(--violet),var(--pink));color:#fff;box-shadow:0 10px 24px -10px var(--violet)}
.btn-main:hover{transform:translateY(-2px);box-shadow:0 14px 28px -10px var(--pink)}
.btn-alt{background:var(--yellow);color:var(--ink)}
.btn-alt:hover{transform:translateY(-2px)}
